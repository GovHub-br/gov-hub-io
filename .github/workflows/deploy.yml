name: Deploy GovHub Documentation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# PRs (o painel /admin/ abre um a cada publicação salva) ficam num grupo próprio: no grupo "pages",
# o build de um PR tomaria o lugar do deploy pendente da main, e a publicação não iria ao ar.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build and validation job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mkdocs-material[recommended,imaging]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # Endereço do site neste repositório (gov-hub.io no oficial, usuario.github.io/repo num fork).
      # Vai para o site_url do mkdocs.yml; em PR fica o padrão, gov-hub.io.
      - name: Setup Pages
        id: pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v4

      - name: Endereço do site
        if: steps.pages.outputs.base_url != ''
        run: echo "SITE_URL=${{ steps.pages.outputs.base_url }}/" >> "$GITHUB_ENV"

      # Página "Histórico de mudanças", montada dos PRs mesclados (não faz commit; se a API falhar, só avisa)
      - name: Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gera_changelog.py

      - name: Validate MkDocs configuration
        run: |
          echo "🔍 Validating MkDocs configuration..."
          mkdocs build --verbose

      - name: Check for orphaned files
        run: |
          echo "🔍 Checking for orphaned documentation files..."
          find docs -name "*.md" -type f > /tmp/all_md_files.txt
          
          python -c "
          import yaml
          import re
          
          # Custom YAML loader that ignores special tags
          class CustomLoader(yaml.SafeLoader):
              pass
          
          def env_constructor(loader, node):
              return 'ENV_PLACEHOLDER'
          
          def python_name_constructor(loader, node):
              return 'PYTHON_NAME_PLACEHOLDER'
          
          def python_object_constructor(loader, node):
              return 'PYTHON_OBJECT_PLACEHOLDER'
          
          CustomLoader.add_constructor('!ENV', env_constructor)
          CustomLoader.add_constructor('tag:yaml.org,2002:python/name:material.extensions.emoji.to_svg', python_name_constructor)
          CustomLoader.add_constructor('tag:yaml.org,2002:python/name:material.extensions.emoji.twemoji', python_name_constructor)
          CustomLoader.add_constructor('tag:yaml.org,2002:python/name:pymdownx.superfences.fence_code_format', python_name_constructor)
          CustomLoader.add_constructor('tag:yaml.org,2002:python/object/apply:pymdownx.slugs.slugify', python_object_constructor)
          
          with open('mkdocs.yml', 'r', encoding='utf-8') as f:
              config = yaml.load(f, Loader=CustomLoader)
          
          referenced_files = set()
          
          def extract_files(nav_item):
              if isinstance(nav_item, dict):
                  for key, value in nav_item.items():
                      if isinstance(value, str) and value.endswith('.md'):
                          referenced_files.add('docs/' + value)
                      elif isinstance(value, list):
                          for item in value:
                              extract_files(item)
                      elif isinstance(value, dict):
                          extract_files(value)
              elif isinstance(nav_item, list):
                  for item in nav_item:
                      extract_files(item)
          
          if 'nav' in config:
              extract_files(config['nav'])
          
          with open('/tmp/referenced_files.txt', 'w') as f:
              for file in sorted(referenced_files):
                  f.write(file + '\n')
          "
          
          comm -23 <(sort /tmp/all_md_files.txt) <(sort /tmp/referenced_files.txt) > /tmp/orphaned_files.txt
          
          if [ -s /tmp/orphaned_files.txt ]; then
            echo "⚠️ Found orphaned documentation files:"
            cat /tmp/orphaned_files.txt
            echo "::warning::Orphaned documentation files found. Consider adding them to navigation or removing them."
          else
            echo "✅ No orphaned files found"
          fi

      - name: Build MkDocs site
        env:
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
        run: |
          echo "🏗️ Building MkDocs site..."
          mkdocs build --verbose

      # ---- Capacitação: capacitacao/, publicada em /capacitacao/ (ver capacitacao/README.md) ----
      - name: Capacitação - dependências (PDFs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          pip install markdown beautifulsoup4 lxml weasyprint
          # mermaid-cli usa o Chrome que já vem no runner
          echo '{"executablePath":"/usr/bin/google-chrome","args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"

      - name: Capacitação - testes
        working-directory: capacitacao
        run: |
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Capacitação - trilhas geradas em dia
        working-directory: capacitacao
        run: |
          python3 tools/gen_roadmap.py
          pendente=$(git status --porcelain --untracked-files=all -- docs/)
          if [ -n "$pendente" ]; then
            echo "::error::Rodar 'python3 tools/gen_roadmap.py' (em capacitacao/) mudou arquivos versionados: uma trilha foi editada sem regenerar, ou falta commitar o esqueleto de uma página nova."
            echo "$pendente"
            git --no-pager diff -- docs/
            exit 1
          fi

      - name: Capacitação - PDFs das aulas e das trilhas
        working-directory: capacitacao
        env:
          MMDC: npx -y @mermaid-js/mermaid-cli@11
          MMDC_PUPPETEER: ${{ runner.temp }}/puppeteer.json
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: python3 tools/gen_pdf.py --saida pdf

      - name: Capacitação - copiar para o site
        run: |
          # As páginas vão como estão: doc.html lê os .md das aulas em tempo de execução.
          rsync -a --exclude tests --exclude tools --exclude package.json capacitacao/ site/capacitacao/
          test -f site/capacitacao/index.html && test -f site/capacitacao/pdf/trilhas/dashboards.pdf

      # Em PR, link quebrado reprova; na main só avisa, para não travar o deploy de uma publicação.
      - name: Links internos
        run: python3 .github/scripts/checa_links.py site ${{ github.event_name != 'pull_request' && '--avisar' || '' }}

      - name: Generate build report
        run: |
          echo "📊 Generating build report..."
          total_md_files=$(find docs -name "*.md" -type f | wc -l)
          total_images=$(find docs -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.svg" | wc -l)
          word_count=$(find docs -name "*.md" -type f -exec cat {} \; | wc -w)
          
          echo "## 📈 Build Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Markdown files:** $total_md_files" >> $GITHUB_STEP_SUMMARY
          echo "- **Total images:** $total_images" >> $GITHUB_STEP_SUMMARY
          echo "- **Approximate word count:** $word_count" >> $GITHUB_STEP_SUMMARY
          echo "- **Build time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Blog posts:** $(find docs/blog/posts -name "*.md" -type f | wc -l)" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # PR vindo de fork recebe token só de leitura: comentar daria 403 e reprovaria o build
      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            let comment = '## 📚 GovHub Documentation Build Results\n\n';
            comment += '✅ MkDocs configuration validated\n';
            comment += '✅ Documentation structure checked\n';
            comment += '✅ Blog integration verified\n';
            comment += '✅ Build completed successfully\n\n';
            comment += 'The documentation site is ready for deployment! 🚀';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Post deployment notification
        run: |
          echo "🚀 GovHub Documentation deployed successfully!"
          echo "📖 Site URL: ${{ steps.deployment.outputs.page_url }}"
