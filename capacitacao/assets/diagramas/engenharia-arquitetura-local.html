="url(#seta)"/><text x="80" y="140" font-size="80" font-weight="700" fill="#0A005A" font-family="Reddit Sans,sans-serif">Como o dado percorre o Gov Hub</text><text x="80" y="214" font-size="44" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">Visão conceitual do ambiente local de aprendizagem</text><text x="865" y="383" font-size="56" font-weight="700" fill="#FFFFFF" font-family="Reddit Sans,sans-serif">Airflow + Cosmos</text><text x="865" y="438" font-size="40" font-weight="400" fill="#FFFFFF" font-family="Reddit Sans,sans-serif">Coordenação de coletas, dependências e execução dbt</text><text x="118" y="705" font-size="47" font-weight="700" fill="#0A005A" font-family="Reddit Sans,sans-serif">Fontes governamentais</text><text x="118" y="772" font-size="37" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">SIAFI, SIAPE, TransfereGov</text><text x="118" y="832" font-size="37" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">ComprasGov, PNCP, SIORG</text><text x="858" y="709" font-size="51" font-weight="700" fill="#0A005A" font-family="Reddit Sans,sans-serif">Clientes Python</text><text x="858" y="776" font-size="41" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">Coleta por fonte</text><text x="858" y="836" font-size="41" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">Interpretação e carga</text><text x="1598" y="709" font-size="51" font-weight="700" fill="#0A005A" font-family="Reddit Sans,sans-serif">PostgreSQL</text><text x="1598" y="776" font-size="41" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">Dados recebidos</text><text x="1598" y="836" font-size="41" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">e saídas analíticas</text><text x="2338" y="705" font-size="47" font-weight="700" fill="#0A005A" font-family="Reddit Sans,sans-serif">Consumo autorizado</text><text x="2338" y="776" font-size="41" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">Superset</text><text x="2338" y="836" font-size="41" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">Jupyter e consultas</text><text x="1598" y="1216" font-size="54" font-weight="700" fill="#0A005A" font-family="Reddit Sans,sans-serif">dbt</text><text x="1598" y="1275" font-size="41" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">Modelos, testes</text><text x="1598" y="1335" font-size="41" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">e documentação</text><text x="1510" y="1027" font-size="37" font-weight="700" fill="#3F28A6" font-family="Reddit Sans,sans-serif">Lê</text><text x="2080" y="1027" font-size="37" font-weight="700" fill="#3F28A6" font-family="Reddit Sans,sans-serif">Materializa</text><text x="80" y="1216" font-size="46" font-weight="700" fill="#0A005A" font-family="Reddit Sans,sans-serif">O dbt transforma no banco:</text><text x="80" y="1286" font-size="42" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">preserva o percurso entre origem,</text><text x="80" y="1348" font-size="42" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">preparação, integração e indicadores.</text><text x="80" y="1484" font-size="34" font-weight="400" fill="#2D3748" font-family="Reddit Sans,sans-serif">O desenho não pressupõe MinIO, Kubernetes ou acesso à infraestrutura compartilhada.</text></svg></html>
