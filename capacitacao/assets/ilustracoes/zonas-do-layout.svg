<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="t d">
  <title id="t">Zonas de um dashboard bem estruturado</title>
  <desc id="d">Wireframe de dashboard em três faixas: no topo, os KPIs principais como resumo executivo; no meio, os gráficos que explicam esses números, agrupados por assunto; embaixo, o detalhe sob demanda, disponível mas sem competir pela atenção.</desc>
  <defs>
    <style>
      .z{font:700 12px Reddit Sans,system-ui,sans-serif;fill:#3F28A6}
      .d{font:12px Reddit Sans,system-ui,sans-serif;fill:#666666}
      .k{font:700 20px Reddit Sans,system-ui,sans-serif;fill:#202020}
      .kl{font:10px Reddit Sans,system-ui,sans-serif;fill:#666666}
      .g{font:11px Reddit Sans,system-ui,sans-serif;fill:#666666}
      .n{font:700 12px Reddit Sans,system-ui,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="780" height="330" fill="#ffffff"/>
  <rect x="24" y="16" width="456" height="298" rx="10" fill="#fff" stroke="#E9DFFF"/>

  <!-- barra de título e filtros -->
  <rect x="38" y="30" width="180" height="14" rx="4" fill="#E9DFFF"/>
  <rect x="330" y="28" width="60" height="18" rx="9" fill="#F2F1F6" stroke="#E9DFFF"/>
  <rect x="396" y="28" width="70" height="18" rx="9" fill="#F2F1F6" stroke="#E9DFFF"/>

  <!-- zona 1: KPIs -->
  <rect x="32" y="56" width="440" height="62" rx="6" fill="#F2F1F6" stroke="#E9DFFF"/>
  <g>
    <rect x="42" y="64" width="100" height="46" rx="5" fill="#fff" stroke="#E9DFFF"/>
    <text class="k" x="54" y="90">12.480</text><text class="kl" x="54" y="103">atendimentos</text>
    <rect x="150" y="64" width="100" height="46" rx="5" fill="#fff" stroke="#E9DFFF"/>
    <text class="k" x="162" y="90">94%</text><text class="kl" x="162" y="103">da meta</text>
    <rect x="258" y="64" width="100" height="46" rx="5" fill="#fff" stroke="#E9DFFF"/>
    <text class="k" x="270" y="90">318</text><text class="kl" x="270" y="103">em andamento</text>
    <rect x="366" y="64" width="96" height="46" rx="5" fill="#fff" stroke="#E9DFFF"/>
    <text class="k" x="378" y="90">-7%</text><text class="kl" x="378" y="103">vs. mês anterior</text>
  </g>

  <!-- zona 2: gráficos -->
  <rect x="32" y="126" width="440" height="102" rx="6" fill="#FFFFFF" stroke="#E9DFFF"/>
  <rect x="42" y="136" width="210" height="82" rx="5" fill="#fff" stroke="#E9DFFF"/>
  <polyline points="54,200 84,186 114,192 144,168 174,172 204,150 234,156" fill="none" stroke="#613EFF" stroke-width="2.5"/>
  <text class="g" x="54" y="152">evolução no tempo</text>
  <rect x="262" y="136" width="200" height="82" rx="5" fill="#fff" stroke="#E9DFFF"/>
  <rect x="274" y="180" width="26" height="28" fill="#613EFF"/><rect x="308" y="168" width="26" height="40" fill="#613EFF"/>
  <rect x="342" y="188" width="26" height="20" fill="#E9DFFF"/><rect x="376" y="176" width="26" height="32" fill="#613EFF"/>
  <rect x="410" y="194" width="26" height="14" fill="#E9DFFF"/>
  <text class="g" x="274" y="152">comparação por unidade</text>

  <!-- zona 3: detalhe -->
  <rect x="32" y="236" width="440" height="66" rx="6" fill="#FFFFFF" stroke="#F2F1F6"/>
  <line x1="42" y1="252" x2="462" y2="252" stroke="#E9DFFF"/>
  <line x1="42" y1="270" x2="462" y2="270" stroke="#F2F1F6"/>
  <line x1="42" y1="288" x2="462" y2="288" stroke="#F2F1F6"/>
  <text class="g" x="42" y="248">tabela detalhada · exportação</text>

  <!-- legendas -->
  <circle cx="504" cy="87" r="10" fill="#613EFF"/><text class="n" x="504" y="91" text-anchor="middle">1</text>
  <text class="z" x="522" y="83">KPIs principais no topo</text>
  <text class="d" x="522" y="99">o resumo executivo da página</text>

  <circle cx="504" cy="170" r="10" fill="#613EFF"/><text class="n" x="504" y="174" text-anchor="middle">2</text>
  <text class="z" x="522" y="166">Gráficos que explicam</text>
  <text class="d" x="522" y="182">próximos ao indicador que sustentam</text>

  <circle cx="504" cy="262" r="10" fill="#613EFF"/><text class="n" x="504" y="266" text-anchor="middle">3</text>
  <text class="z" x="522" y="258">Detalhe sob demanda</text>
  <text class="d" x="522" y="274">disponível, sem competir pela atenção</text>
</svg>
