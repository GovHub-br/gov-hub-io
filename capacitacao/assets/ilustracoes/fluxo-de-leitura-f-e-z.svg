<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">Padrões de leitura F e Z</title>
  <desc id="d">Dois wireframes de dashboard. No padrão F, o olhar percorre a faixa superior, desce pela lateral esquerda e explora o centro. No padrão Z, o olhar vai do topo esquerdo ao topo direito, cruza para o centro e termina na parte inferior.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#613EFF"/>
    </marker>
    <style>
      .rot{font:600 13px Reddit Sans,system-ui,sans-serif;fill:#202020}
      .leg{font:12px Reddit Sans,system-ui,sans-serif;fill:#666666}
      .n{font:700 12px Reddit Sans,system-ui,sans-serif;fill:#fff}
      .bloco{fill:#F2F1F6;stroke:#E9DFFF}
      .cam{stroke:#613EFF;stroke-width:3.5;fill:none;marker-end:url(#seta);stroke-linecap:round}
    </style>
  </defs>
  <rect width="720" height="300" fill="#ffffff"/>

  <!-- ===== padrão F ===== -->
  <text class="rot" x="30" y="26">Padrão F · painéis densos, muitos blocos</text>
  <rect x="30" y="40" width="300" height="215" rx="8" fill="#fff" stroke="#E9DFFF"/>
  <rect class="bloco" x="44" y="54" width="272" height="34" rx="5"/>
  <rect class="bloco" x="44" y="98" width="80" height="60" rx="5"/>
  <rect class="bloco" x="132" y="98" width="80" height="60" rx="5"/>
  <rect class="bloco" x="220" y="98" width="96" height="60" rx="5"/>
  <rect class="bloco" x="44" y="168" width="130" height="74" rx="5"/>
  <rect class="bloco" x="182" y="168" width="134" height="74" rx="5"/>
  <path class="cam" d="M56 71 H300"/>
  <path class="cam" d="M56 126 H228"/>
  <path class="cam" d="M56 82 V232"/>
  <circle cx="56" cy="71" r="9" fill="#613EFF"/><text class="n" x="56" y="75" text-anchor="middle">1</text>
  <circle cx="56" cy="126" r="9" fill="#613EFF"/><text class="n" x="56" y="130" text-anchor="middle">2</text>
  <text class="leg" x="30" y="277">topo → lateral esquerda → centro</text>

  <!-- ===== padrão Z ===== -->
  <text class="rot" x="390" y="26">Padrão Z · telas executivas, poucos elementos</text>
  <rect x="390" y="40" width="300" height="215" rx="8" fill="#fff" stroke="#E9DFFF"/>
  <rect class="bloco" x="404" y="54" width="130" height="50" rx="5"/>
  <rect class="bloco" x="546" y="54" width="130" height="50" rx="5"/>
  <rect class="bloco" x="404" y="118" width="272" height="60" rx="5"/>
  <rect class="bloco" x="404" y="190" width="272" height="52" rx="5"/>
  <path class="cam" d="M418 79 H660"/>
  <path class="cam" d="M660 92 L424 205"/>
  <path class="cam" d="M418 216 H660"/>
  <circle cx="418" cy="79" r="9" fill="#613EFF"/><text class="n" x="418" y="83" text-anchor="middle">1</text>
  <circle cx="662" cy="79" r="9" fill="#613EFF"/><text class="n" x="662" y="83" text-anchor="middle">2</text>
  <circle cx="418" cy="216" r="9" fill="#613EFF"/><text class="n" x="418" y="220" text-anchor="middle">3</text>
  <text class="leg" x="390" y="277">topo esquerdo → topo direito → centro → base</text>
</svg>
