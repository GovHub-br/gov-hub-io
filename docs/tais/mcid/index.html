<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>graphrag-tais architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700;800;900&display=swap">
<style>
/* Mapa da arquitetura do graphrag-tais em níveis: visão geral com seis blocos; cada bloco abre a
   vista de dentro dele. Setas calculadas a partir da posição real dos cards na grade.
   IDV Gov Hub, modo sóbrio (GovHub-skills/01-govhub): roxo #613EFF, navy #0A005A, claro #F2F1F6,
   acento #BE006E só em detalhe (pendência), Reddit Sans em tudo. Setas tipadas como na skill
   govhub-diagramas: exec, data, meta, flow, gov. */
:root{
  --bg:#F2F1F6; --paper:#FFFFFF; --ink:#0A005A; --text:#2D3748; --muted:#666666; --line:#E9DFFF;
  --purple:#613EFF; --purple-600:#5235D9; --purple-700:#3F28A6; --on-purple:#FFFFFF;
  --tint-1:rgba(97,62,255,.06); --tint-2:rgba(97,62,255,.12); --tint-3:rgba(97,62,255,.30);
  --accent:#BE006E; --gray:#9CA3AF;
  --shadow:0 2px 10px rgba(10,0,90,.10); --shadow-lg:0 8px 30px rgba(10,0,90,.16);
  /* papéis: no claro valem os tokens da IDV; o escuro troca só estes */
  --cta:#613EFF; --cta-hover:#5235D9; --card-border:var(--purple); --person-border:#3F28A6;
  --pilln-bg:#0A005A; --pilln-fg:#FFFFFF; --head-bg:#0A005A; --head-fg:#FFFFFF;
  --icon-bg:transparent; --zone-border:var(--purple); --zone-bg:var(--tint-1); --glow:none;
  --font:'Reddit Sans','Open Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121217; --paper:#1B1B22; --ink:#F3F3F7; --text:#D4D4DD; --muted:#9696A6; --line:rgba(255,255,255,.09);
  --purple:#9A88FF; --purple-600:#AC9DFF; --purple-700:#C9BFFF; --on-purple:#FFFFFF;
  --tint-1:rgba(154,136,255,.04); --tint-2:rgba(154,136,255,.13); --tint-3:rgba(154,136,255,.28);
  --accent:#FF5BAA; --gray:#5C5C6B;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px rgba(0,0,0,.5);
  --cta:#613EFF; --cta-hover:#7356FF; --card-border:rgba(255,255,255,.11); --person-border:rgba(255,255,255,.2);
  --pilln-bg:#F2F1F6; --pilln-fg:#0A005A; --head-bg:#26262F; --head-fg:#FFFFFF;
  --icon-bg:#F2F1F6; --zone-border:rgba(154,136,255,.32); --zone-bg:rgba(255,255,255,.015);
  --glow:radial-gradient(1000px 460px at 88% -10%,rgba(97,62,255,.16),transparent 65%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121217; --paper:#1B1B22; --ink:#F3F3F7; --text:#D4D4DD; --muted:#9696A6; --line:rgba(255,255,255,.09);
  --purple:#9A88FF; --purple-600:#AC9DFF; --purple-700:#C9BFFF; --on-purple:#FFFFFF;
  --tint-1:rgba(154,136,255,.04); --tint-2:rgba(154,136,255,.13); --tint-3:rgba(154,136,255,.28);
  --accent:#FF5BAA; --gray:#5C5C6B;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px rgba(0,0,0,.5);
  --cta:#613EFF; --cta-hover:#7356FF; --card-border:rgba(255,255,255,.11); --person-border:rgba(255,255,255,.2);
  --pilln-bg:#F2F1F6; --pilln-fg:#0A005A; --head-bg:#26262F; --head-fg:#FFFFFF;
  --icon-bg:#F2F1F6; --zone-border:rgba(154,136,255,.32); --zone-bg:rgba(255,255,255,.015);
  --glow:radial-gradient(1000px 460px at 88% -10%,rgba(97,62,255,.16),transparent 65%);
  color-scheme:dark}
.on-dark{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--icon-pad:5px}}
:root[data-theme="dark"]{--icon-pad:5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .on-dark{display:inline-block!important}:root:not([data-theme="light"]) .on-light{display:none!important}}
:root[data-theme="dark"] .on-dark{display:inline-block!important}
:root[data-theme="dark"] .on-light{display:none!important}

html,body{margin:0}
body{min-height:100vh;background:var(--glow),var(--bg);background-repeat:no-repeat;color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}

/* Barra superior */
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 20px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:14px;min-width:0;border:0;background:none;padding:0}
.brand img{height:30px;width:auto}
.brand .prod{padding-left:14px;border-left:2px solid var(--line);font:400 18px/1 var(--font);color:var(--ink);letter-spacing:-.01em}
.brand .prod b{font-weight:800}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0;font:600 13px/1.2 var(--font)}
.crumbs button{border:0;background:none;padding:4px 2px;color:var(--purple-700);text-decoration:underline;text-underline-offset:3px}
.crumbs span[aria-current]{padding:5px 12px;background:var(--cta);color:#fff;border-radius:999px}
.crumbs i{font-style:normal;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border:1.5px solid var(--purple);border-radius:999px;background:var(--paper);color:var(--purple-700);font:700 13px var(--font);white-space:nowrap}
.btn:hover{background:var(--tint-2)}
.btn[aria-pressed="true"],.btn.solid{background:var(--cta);border-color:var(--cta);color:#fff}
.btn.solid:hover{background:var(--cta-hover)}
.btn.icon{width:36px;padding:0;justify-content:center;font-size:16px}

/* Vista */
main{padding:28px 20px 30px}
.view{max-width:1480px;margin:0 auto}
.view.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1) both;transform-origin:var(--ox,50%) var(--oy,0)}
.view.back{animation:back .3s ease both}
@keyframes enter{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes back{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.vhead{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin:0 0 58px}
.vhead > div{min-width:0;max-width:820px}
.vkick{display:inline-block;margin:0 0 12px;padding:5px 12px;border-radius:999px;background:var(--line);color:var(--purple-700);font:700 11.5px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase}
.vhead h1{margin:0;font:800 46px/1.04 var(--font);letter-spacing:-.025em;color:var(--ink)}
.vhead h1 .n{display:inline-grid;place-items:center;width:52px;height:52px;margin-right:14px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:28px;vertical-align:6px}
.vhead h1 .lt{font-weight:400}
.vlead{margin:14px 0 0;font:400 17px/1.55 var(--font);max-width:74ch}
.shapes{flex:none;width:200px;height:120px}
.shapes .p{fill:var(--cta)} .shapes .n{fill:var(--ink)} .shapes .r{fill:none;stroke:var(--purple);stroke-width:14} .shapes .s{fill:var(--line)}
.ask{display:flex;gap:14px;align-items:flex-start;max-width:600px;padding:14px 18px;border-radius:16px 16px 16px 4px;background:var(--paper);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.ask .qm{font:800 46px/.8 var(--font);color:var(--accent)}
.ask b{display:block;font:700 11px/1.2 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--purple-700);margin-bottom:4px}
.ask q{font:600 16px/1.4 var(--font);color:var(--ink)}
.ask q::before,.ask q::after{content:none}
.ask small{display:block;margin-top:6px;font:400 12.5px/1.4 var(--font);color:var(--muted)}

/* Grade, zonas e setas */
.board{--cg:clamp(56px,6vw,96px);position:relative;display:grid;gap:84px var(--cg);align-items:stretch}
.zone{position:absolute;z-index:0;border:2px solid var(--zone-border);border-radius:16px;background:var(--zone-bg);pointer-events:none}
.zone.dashed{border-style:dashed}
.zone .pill{left:20px;top:-15px;box-shadow:0 0 0 4px var(--bg)}
.wires{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.wire{fill:none;stroke-width:2.2;transition:opacity .2s}
.w-exec{stroke:var(--ink)} .w-data{stroke:var(--ink);stroke-dasharray:7 5}
.w-meta{stroke:var(--purple);stroke-dasharray:7 5} .w-flow{stroke:var(--purple)}
.w-gov{stroke:var(--accent);stroke-dasharray:7 5}
.wire.on{stroke-width:3.6}
.wire.dim,.elabel.dim{opacity:.14}
.m-ink path{fill:var(--ink)} .m-pur path{fill:var(--purple)} .m-acc path{fill:var(--accent)}
.elabel{position:absolute;z-index:3;transform:translate(-50%,-50%);width:max-content;padding:3px 10px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;
  color:var(--purple-700);font:700 11.5px/1.25 var(--font);text-align:center;pointer-events:none;transition:opacity .2s}
.elabel.on{background:var(--cta);border-color:var(--cta);color:#fff}
.lane{align-self:end;display:flex;align-items:center;gap:10px;margin-bottom:-60px;font:700 11.5px/1.2 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--purple-700)}
.lane::after{content:"";flex:1;border-top:2px dotted var(--line)}

/* Pílula (rótulo sobre a borda) */
.pill{position:absolute;top:-13px;left:14px;z-index:2;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;padding:5px 12px;border-radius:999px;background:var(--cta);color:#fff;
  font:700 10.5px/1.15 var(--font);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;box-shadow:0 0 0 4px var(--bg)}
.pill.navy{background:var(--pilln-bg);color:var(--pilln-fg)}
.pill.acc{background:var(--accent);color:#fff}
.pill.soft{background:var(--line);color:var(--purple-700)}

/* Cards */
.node{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px;min-width:0;padding:24px 18px 16px;text-align:left;
  background:var(--paper);color:var(--text);border:2px solid var(--card-border);border-radius:10px;box-shadow:var(--shadow);transition:opacity .2s,transform .15s,box-shadow .15s}
button.node:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--purple)}
.node.dim{opacity:.3}
.node.pin{outline:4px solid var(--accent);outline-offset:5px}
.node > span{display:block}
.ttl{font:800 18px/1.15 var(--font);letter-spacing:-.015em;color:var(--ink);text-wrap:balance}
.tx{font:400 13.5px/1.48 var(--font);color:var(--text)}
.ex{font:500 12.5px/1.42 var(--font);padding:7px 10px;border-radius:6px;background:var(--bg);color:var(--text)}
.ex b{font-weight:800;color:var(--purple-700)}
.tags{display:flex!important;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--purple-700);font:600 11px/1.35 var(--font)}
.tag.code{font:600 10.5px/1.4 var(--mono)}
.badge{display:inline-flex!important;align-self:flex-start;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font:800 10.5px/1.3 var(--font);letter-spacing:.05em;text-transform:uppercase}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.det{background:var(--bg);color:var(--purple-700)}
.badge.llm{background:var(--ink);color:var(--paper)}
.badge.pend{background:var(--bg);color:var(--accent)}
.note{display:block;padding:8px 11px;border:1.5px dashed var(--accent);border-radius:6px;background:var(--bg);font:500 12px/1.4 var(--font);color:var(--text)}
.note b{color:var(--accent);font-weight:800}
.open{display:inline-flex!important;align-self:flex-start;align-items:center;gap:6px;margin-top:6px;padding:8px 15px;border-radius:999px;background:var(--cta);color:#fff;font:700 12.5px/1 var(--font)}
button.node:hover .open{background:var(--cta-hover)}
.ico{position:absolute;top:14px;right:14px;width:46px;height:46px;padding:var(--icon-pad,0);border-radius:12px;background:var(--icon-bg)}
.has-ico .ttl,.has-ico .tx{padding-right:44px}
.outs{display:none!important}
.num{display:inline-grid!important;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 17px/1 var(--font)}

.k-stage{border-width:2.5px;padding-top:26px}
.k-stage .ttl{font-size:23px}
.k-person{border-radius:28px;border-color:var(--person-border);padding-inline:22px}
.k-store{margin-top:16px;border-top-left-radius:0;border-top-right-radius:0;background:linear-gradient(var(--tint-1),var(--tint-1)),var(--paper)}
.k-store::before{content:"";position:absolute;left:-2px;right:-2px;top:-20px;height:22px;border:2px solid var(--card-border);border-bottom:0;border-radius:50%/100% 100% 0 0;background:var(--paper)}
.k-store .pill{top:-30px}
.k-store .ttl{font-size:21px}
#stage [data-id="s-exp"]{align-self:center}
.k-pend{border-style:dashed;border-color:var(--accent);box-shadow:none}
.k-goto{background:var(--cta);border-color:var(--cta);color:#fff;justify-content:center}
.k-goto .ttl,.k-goto .tx{color:#fff}
.k-goto .open{background:#fff;color:#3F28A6}
.k-band{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:22px;align-items:center;margin-top:-34px;padding:24px 22px 18px}
.k-band > .num{grid-row:1 / span 2}
.k-band > .ttl,.k-band > .tx{grid-column:2}
.k-band > .tags{grid-column:3;grid-row:1;margin:0;justify-content:flex-end}
.k-band > .open{grid-column:3;grid-row:2;justify-self:end;margin:0}
.k-plat .ttl{font-size:21px}
.k-note{border:1.5px solid var(--line);box-shadow:none;background:var(--paper);align-self:start}
.k-fig{padding:26px 18px 14px}
.k-check .ttl{font-size:16px}

/* Listas e figuras dentro do card */
.doclist{display:flex!important;flex-direction:column;gap:0;margin-top:2px;border-top:1.5px solid var(--line)}
.doclist.grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:22px}
.doclist > span{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.doclist i{grid-row:1 / span 2;width:22px;height:22px;border-radius:50%;background:var(--tint-2);color:var(--purple-700);display:grid;place-items:center;font:800 11px/1 var(--font);font-style:normal}
.doclist b{font:700 12.5px/1.3 var(--font);color:var(--ink)}
.doclist small{font:400 11.5px/1.35 var(--font);color:var(--muted)}
.kv{display:grid!important;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;margin-top:2px;padding-top:8px;border-top:1.5px solid var(--line);font:400 12px/1.4 var(--font)}
.kv b{font:700 12px/1.4 var(--mono);color:var(--purple-700)}
.li{display:flex!important;flex-direction:column;gap:5px;margin-top:2px;padding-top:8px;border-top:1.5px solid var(--line);font:500 12px/1.4 var(--font)}
.li > span::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--purple);vertical-align:1px}
.layers{display:flex!important;flex-direction:column;gap:6px}
.ly{display:flex;align-items:baseline;gap:8px;padding:8px 11px;border:2px solid var(--card-border);border-radius:8px;font:400 12px/1.3 var(--font)}
.ly b{font:800 13px/1 var(--font);min-width:46px}
.ly.l1{background:var(--tint-2)} .ly.l2{background:var(--tint-3)} .ly.l3{background:var(--cta);border-color:var(--cta);color:#fff}
.pipe{display:flex!important;flex-wrap:wrap;align-items:center;gap:6px 4px;margin-top:2px}
.pp{padding:5px 10px;border:2px solid var(--card-border);border-radius:999px;background:var(--paper);font:700 11.5px/1.2 var(--font);color:var(--ink)}
.pp.src{border-style:dashed}
.pp.gate{border-color:var(--pilln-bg);background:var(--pilln-bg);color:var(--pilln-fg)}
.pp.l1{background:var(--tint-2)} .pp.l2{background:var(--tint-3)} .pp.l3{background:var(--cta);border-color:var(--cta);color:#fff}
.pipe .ar{color:var(--purple);font-weight:800}
.mg{display:flex!important;flex-direction:column;gap:6px;padding:9px 0 2px;border-top:1.5px solid var(--line)}
.mg > b{font:800 13px/1.2 var(--font);color:var(--ink)}
.mg > b i{font-style:normal;font-weight:400;color:var(--muted)}
.mg .tags{margin-top:0}
.fig{display:block;width:100%;height:auto;overflow:visible}
.fig text{font-family:var(--font);fill:var(--text)}
.fig .t{fill:var(--paper);stroke:var(--purple);stroke-width:2}
.fig .tf{fill:var(--cta)} .fig .tt{fill:var(--tint-2);stroke:var(--purple);stroke-width:2}
.fig .tg{fill:var(--paper);stroke:var(--gray);stroke-width:2;stroke-dasharray:5 4}
.fig .c{fill:var(--bg);stroke:var(--purple);stroke-width:1.5}
.fig .l{stroke:var(--purple);stroke-width:1.5}
.fig .row{fill:var(--paper);stroke:var(--line);stroke-width:1}
.fig .j{stroke:var(--purple);stroke-width:3;fill:none}
.fig .jg{stroke:var(--gray);stroke-width:2;stroke-dasharray:6 5;fill:none}
.fig .w{fill:#fff;font-weight:800} .fig .h{font-weight:800;fill:var(--ink)} .fig .g{fill:var(--gray)} .fig .p7{fill:var(--purple-700);font-weight:700}
.fig .mono{font-family:var(--mono)}
.fig .dot{fill:var(--accent)} .fig .key{fill:var(--purple)}
.figcard{display:flex!important;flex-direction:column;gap:4px;padding:10px 12px;border:1.5px dashed var(--card-border);border-radius:8px;background:var(--bg);font:400 11.5px/1.4 var(--font)}
.figcard b{font:700 11px/1.3 var(--mono);color:var(--ink)}
.figcard code{font:500 10.5px/1.4 var(--mono);color:var(--purple-700);overflow-wrap:anywhere}

/* Produtos (vista Entregar) */
.k-persona{padding:0;gap:0;overflow:hidden}
.phead{position:relative;display:flex;flex-direction:column;gap:8px;padding:22px 22px 18px;background:var(--head-bg);color:var(--head-fg)}
.phead .kk{font:700 11px/1.2 var(--font);letter-spacing:.07em;text-transform:uppercase;opacity:.8}
.phead .ttl{font:800 32px/1 var(--font);color:var(--head-fg)}
.phead .who{font:400 14px/1.45 var(--font)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:18px 20px 18px}
.tile{display:flex;flex-direction:column;gap:5px;padding:12px 13px 13px;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--tint-1);transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--purple)}
.tile img{width:38px;height:38px;padding:var(--icon-pad,0);border-radius:10px;background:var(--icon-bg)}
.tile b{font:800 15px/1.2 var(--font);color:var(--ink)}
.tile span{font:400 12.5px/1.42 var(--font)}
.tile .badge{margin-top:3px}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 18px}

/* Legenda e rodapé */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;margin-top:44px;padding:14px 22px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font:400 12.5px/1.3 var(--font)}
.legend > b{font:800 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.legend .it{display:flex;align-items:center;gap:9px}
.legend svg{width:46px;height:12px;overflow:visible;flex:none}
.legend .sw{width:26px;height:17px;border:2px solid var(--card-border);border-radius:5px;background:var(--paper);flex:none}
.legend .sw.store{border-radius:3px 3px 5px 5px;border-top-width:5px;background:var(--tint-1)}
.legend .sw.person{border-radius:9px;border-color:var(--purple-700)}
.legend .sw.pend{border-style:dashed;border-color:var(--accent)}
.legend .sw.go{background:var(--cta);border-color:var(--cta)}
.vfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:22px}
.vfoot p{margin:0;max-width:80ch;font:400 14px/1.55 var(--font)}
.sib{display:flex;flex-wrap:wrap;gap:8px}
.site-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 30px;max-width:1480px;margin:34px auto 0;padding:18px 20px 26px;border-top:1.5px solid var(--line);font:400 12.5px/1.4 var(--font);color:var(--muted)}
.partners{display:flex;flex-wrap:wrap;align-items:center;gap:22px}
.partners img{height:30px;width:auto}
.partners img.lab{height:24px}

/* Painel lateral */
.panel{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(470px,100%);background:var(--paper);border-left:1.5px solid var(--line);overflow:auto;overscroll-behavior:contain;box-shadow:-10px 0 30px rgba(10,0,90,.14)}
.ph{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;background:var(--head-bg);color:var(--head-fg);z-index:1}
.ph b{font:800 15px/1.2 var(--font);letter-spacing:.02em}
.ph .btn{background:transparent;border-color:var(--head-fg);color:var(--head-fg)}
.pb{padding:18px 24px 34px}
.d-eb{display:inline-block;margin:0 0 10px;padding:4px 11px;border-radius:999px;background:var(--line);color:var(--purple-700);font:700 11px/1.3 var(--font);letter-spacing:.05em;text-transform:uppercase}
.pb h2{margin:0 0 10px;font:800 25px/1.12 var(--font);letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
.lead{margin:0 0 6px;font:400 15.5px/1.55 var(--font)}
.sec{margin-top:20px}
.sec h3{margin:0 0 8px;font:800 11.5px/1.2 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.sec p{margin:0;font:400 14px/1.6 var(--font)}
.sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font:400 14px/1.5 var(--font)}
.sec ul li::marker{color:var(--purple)}
.sec.warn{padding:12px 14px;border:1.5px dashed var(--accent);border-radius:8px;background:var(--bg)}
.sec.warn h3{color:var(--accent)}
.sec code,.codes code{font:600 12px var(--mono);background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere;color:var(--purple-700)}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.tbl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font:400 13.5px/1.45 var(--font)}
.tbl b{font-weight:700;color:var(--ink)}
.mt{display:flex;flex-direction:column;gap:8px}
.mt div{padding:9px 12px;border-radius:8px;background:var(--bg)}
.mt b{display:block;font:700 13.5px/1.3 var(--font);color:var(--ink)}
.mt code{font:600 11px var(--mono);color:var(--purple-700)}
.mt span{display:block;font:400 13px/1.45 var(--font)}
.lk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;margin-bottom:7px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
.lk:hover{border-color:var(--purple);box-shadow:var(--shadow)}
.lk .dir{font:800 14px/1.2 var(--font);width:16px;flex:none;color:var(--purple)}
.lk b{display:block;font:700 13.5px/1.3 var(--font);color:var(--ink)}
.lk small{display:block;font:400 12.5px/1.4 var(--font);color:var(--muted)}
.dgroup{margin-top:20px}
.dgroup h3{margin:0 0 9px;font:800 16px/1.2 var(--font);color:var(--ink)}
.dgroup.warn h3{color:var(--accent)}
.gl{margin:0;display:grid;gap:10px}
.gl div{padding-bottom:10px;border-bottom:1px solid var(--line)}
.gl dt{font:800 14.5px/1.3 var(--font);color:var(--ink)}
.gl dt span{font:400 12.5px var(--font);color:var(--muted);margin-left:6px}
.gl dd{margin:3px 0 0;font:400 13.5px/1.5 var(--font)}

/* Celular: a grade vira coluna e as setas viram linhas de texto embaixo de cada card */
@media (max-width:880px){
  .brand img{height:24px}.brand .prod{font-size:15px}
  .tools{margin-left:0}
  .crumbs{order:3;flex-basis:100%}
  .vhead h1{font-size:34px}.shapes{display:none}
  .board{display:flex!important;flex-direction:column;gap:30px}
  .wires,.elabel,.zone{display:none}
  .lane{margin:8px 0 -10px}
  .outs{display:flex!important;flex-direction:column;gap:3px;margin-top:4px;padding-top:8px;border-top:1.5px dashed var(--line);font:600 12px/1.35 var(--font);color:var(--purple-700)}
  .k-band{display:flex;margin-top:0}
  .k-store{margin-top:24px}
  .ico{width:38px;height:38px}
  .panel{top:auto;height:74%;width:100%;border-left:0;border-top:1.5px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){.view.enter,.view.back{animation:none}.node,.tile,.wire{transition:none}button.node:hover,.tile:hover{transform:none}}
</style>

  ask:{q:'Month by month, how did the released value evolve for FDS projects classified as “Desembolso Adiantado”? Show APF, project, state, monthly value and cumulative disbursement.',n:'Real question from the business test set. The right answer needs two tables joined on APF.'},

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage = $('#stage'), drawer = $('#drawer');
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const where = {}, byId = {};
for (const [vid, v] of Object.entries(VIEWS)) for (const n of v.nodes) {
  where[n.id] = vid; byId[n.id] = n;
  for (const t of n.tiles || []) { where[t.id] = vid; byId[t.id] = {...t, parent:n}; }
}
const state = {view:null, focus:null, pin:null, board:null, edges:[], zones:[]};
for (const img of document.querySelectorAll('[data-asset]')) if (ASSET[img.dataset.asset]) img.src = ASSET[img.dataset.asset];
const icon = (name, cls = 'ico') => ASSET['i:' + name] ? `<img class="${cls}" src="${ASSET['i:' + name]}" alt="">` : '';

/* ---------- desenho dos cards ---------- */
const tags = xs => xs && xs.length ? `<span class="tags">${xs.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</span>` : '';
const badge = b => b ? `<span class="badge ${b[0]}">${esc(b[1])}</span>` : '';
function face(n, v) {
  let h = n.pill ? `<span class="pill ${n.k === 'pend' ? 'acc' : n.k === 'store' ? 'navy' : ''}">${esc(n.pill)}</span>` : '';
  if (n.ico) h += icon(n.ico);
  if (n.n) h += `<span class="num" aria-hidden="true">${n.n}</span>`;
  if (n.t) h += `<span class="ttl">${esc(n.t)}</span>`;
  if (n.badge && n.k !== 'band') h += badge(n.badge);
  if (n.s) h += `<span class="tx">${esc(n.s)}</span>`;
  if (n.fig) h += FIG[n.fig];
  if (n.docs) h += `<span class="doclist${n.docsGrid ? ' grid' : ''}">${n.docs.map((r, i) => `<span><i>${i + 1}</i><b>${esc(r[0])}</b><small>${esc(r[1])}</small></span>`).join('')}</span>`;
  if (n.kv) h += `<span class="kv">${n.kv.map(r => `<b>${esc(r[0])}</b><span>${esc(r[1])}</span>`).join('')}</span>`;
  if (n.li) h += `<span class="li">${n.li.map(x => `<span>${esc(x)}</span>`).join('')}</span>`;
  if (n.cards) h += n.d.metrics.map(([g, ms, q]) => `<span class="mg"><b>${esc(g)} <i>· ${esc(q)}</i></b>${tags(ms.map(m => m[0]))}</span>`).join('');
  if (n.ex) h += `<span class="ex"><b>Example · </b>${esc(n.ex)}</span>`;
  if (n.note) h += `<span class="note">${n.note}</span>`;
  h += tags(n.tags);
  if (n.go) h += `<span class="open">Go inside <span aria-hidden="true">→</span></span>`;
  const outs = (v.edges || []).filter(e => e.a === n.id);
  if (outs.length) h += `<span class="outs">${outs.map(e => `<span>→ ${e.l ? esc(e.l) + ' · ' : ''}<b>${esc(byId[e.b].t || byId[e.b].pill)}</b></span>`).join('')}</span>`;
  return h;
}
function persona(n) {
  return `<div class="phead"><span class="kk">${esc(n.kick)}</span><span class="ttl">${esc(n.t)}</span><span class="who">${esc(n.who)}</span></div>
    <div class="tiles">${n.tiles.map(t => `<button class="tile" type="button" data-tile="${t.id}">${icon(t.ic, '')}<b>${esc(t.t)}</b><span>${esc(t.s)}</span>${badge(t.badge)}</button>`).join('')}</div>
    <div class="pfoot">${n.foot.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>`;
}
function legendHtml(v) {
  const used = [...new Set((v.edges || []).map(e => e.ty))];
  const kinds = new Set(v.nodes.map(n => n.k));
  const items = [];
  if (kinds.has('stage')) items.push(`<span class="it"><i class="sw go"></i>Numbered block: click to go inside</span>`);
  if (kinds.has('store')) items.push(`<span class="it"><i class="sw store"></i>Storage (database)</span>`);
  if (kinds.has('person')) items.push(`<span class="it"><i class="sw person"></i>Person</span>`);
  if (kinds.has('pend') || v.nodes.some(n => n.note)) items.push(`<span class="it"><i class="sw pend"></i>Pending or not done yet</span>`);
  if (v.nodes.some(n => n.badge && n.badge[0] === 'llm')) items.push(`<span class="it"><span class="badge llm">LLM</span>Uses the LLM</span>`);
  for (const t of ['exec','data','meta','flow','gov']) if (used.includes(t)) {
    items.push(`<span class="it"><svg viewBox="0 0 46 12" aria-hidden="true"><path class="wire w-${t}" d="M1 6H36" marker-end="url(#lg-${ARROW[t][1]})"/></svg>${ARROW[t][0]}</span>`);
  }
  if (!items.length) return '';
  return `<div class="legend"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${['m-ink','m-pur','m-acc'].map(m => `<marker id="lg-${m}" class="${m}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>`).join('')}</defs></svg><b>Legend</b>${items.join('')}${(v.edges || []).length ? '<span class="it">Hover a card to follow its arrows</span>' : ''}</div>`;
}

    : `<button type="button" data-view="home">Overview</button><i aria-hidden="true">›</i><span aria-current="page">${v.n}. ${esc(v.t)}</span>`;
}
const SHAPES = `<svg class="shapes" viewBox="0 0 200 120" aria-hidden="true"><circle class="s" cx="150" cy="60" r="50"/><path class="p" d="M60 120a60 60 0 0 1 120 0z"/><circle class="r" cx="58" cy="44" r="30"/><circle class="n" cx="176" cy="20" r="12"/></svg>`;
function render(id, how, origin) {
  id = VIEWS[id] ? id : 'home';
  const v = VIEWS[id];
  state.view = id; state.focus = null;
  crumbs(id);
  document.title = id === 'home' ? 'graphrag-tais architecture' : `${v.t} · graphrag-tais`;
  const i = ORDER.indexOf(id);
  const prev = ORDER[i - 1], next = ORDER[i + 1];
  const sec = document.createElement('section');
  sec.className = 'view' + (reduce ? '' : how === 'in' ? ' enter' : how === 'out' ? ' back' : '');
  if (origin) { sec.style.setProperty('--ox', origin[0] + 'px'); sec.style.setProperty('--oy', origin[1] + 'px'); }
  sec.innerHTML = `<div class="vhead"><div>
      <p class="vkick">${esc(v.kick)}</p>
      <h1>${v.n ? `<span class="n">${v.n}</span>` : ''}${esc(v.t)}</h1>
      <p class="vlead">${esc(v.lead)}</p></div>
      ${v.ask ? `<div class="ask"><span class="qm" aria-hidden="true">“</span><div><b>Follow one question</b><q>${esc(v.ask.q)}</q><small>${esc(v.ask.n)}</small></div></div>` : v.shapes ? SHAPES : ''}
    </div>
    <div class="board" style="${v.cg ? `--cg:${v.cg};` : ''}${v.rg ? `row-gap:${v.rg};` : ''}grid-template-columns:${v.cols};grid-template-areas:${v.areas.map(r => `'${r}'`).join(' ')}"></div>
    ${legendHtml(v)}
    <div class="vfoot"><p>${esc(v.foot || '')}</p>
      ${id === 'home' ? '' : `<div class="sib">
        ${prev ? `<button class="btn" type="button" data-view="${prev}">← ${VIEWS[prev].n}. ${esc(VIEWS[prev].t)}</button>` : ''}
        <button class="btn" type="button" data-view="home">↑ Overview</button>
        ${next ? `<button class="btn solid" type="button" data-view="${next}">${VIEWS[next].n}. ${esc(VIEWS[next].t)} →</button>` : ''}</div>`}
    </div>`;
  const board = sec.querySelector('.board');
  for (const n of v.nodes) {
    const el = document.createElement(n.k === 'persona' || n.k === 'fig' ? 'section' : 'button');
    el.className = `node k-${n.k}` + (n.ico ? ' has-ico' : '');
    el.dataset.id = n.id; el.style.gridArea = n.area;
    if (n.k === 'persona') { el.innerHTML = persona(n); el.setAttribute('aria-label', n.t); }
    else {
      el.innerHTML = face(n, v);
      if (el.tagName === 'BUTTON') { el.type = 'button'; el.setAttribute('aria-label', `${n.t || n.pill}. ${n.go ? 'Go inside.' : 'Open details.'}`); }
    }
    board.appendChild(el); n.el = el;
  }
  for (const ln of v.lanes || []) {
    const d = document.createElement('div'); d.className = 'lane'; d.style.gridArea = ln.area;
    d.innerHTML = `${esc(ln.t)} ${badge(ln.badge)}`; board.insertBefore(d, byId[ln.before].el);
  }
  state.zones = (v.zones || []).map(z => {
    const d = document.createElement('div'); d.className = 'zone' + (z.dashed ? ' dashed' : '');
    d.innerHTML = `<span class="pill navy">${esc(z.t)}</span>`; board.prepend(d);
    return {...z, el:d};
  });
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'wires'); svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = `<defs>${['m-ink','m-pur','m-acc'].map(m => `<marker id="${m}" class="${m}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>`).join('')}</defs>`;
  board.prepend(svg);
  state.board = board; state.svg = svg;
  state.edges = (v.edges || []).map(e => ({...e}));
  for (const e of state.edges) {
    e.p = document.createElementNS(NS, 'path'); e.p.setAttribute('class', `wire w-${e.ty}`); svg.appendChild(e.p);
    if (e.l) { e.lab = document.createElement('div'); e.lab.className = 'elabel'; e.lab.textContent = e.l; board.appendChild(e.lab); }
  }
  stage.replaceChildren(sec);
  wires();
  if (state.pin) applyPin();
  ro.disconnect(); ro.observe(board);
  if (how) scrollTo({top:0, behavior:reduce ? 'auto' : 'smooth'});
}

/* ---------- setas ----------
   Lado de saída e chegada vem da posição relativa dos cards; quando os dois se sobrepõem no
   eixo perpendicular, a seta sai reta pelo meio da sobreposição. fa/fb fixam a posição ao
   longo do lado e off desloca as duas pontas, para duas setas opostas não se sobreporem. */
const NV = {l:[-1,0], r:[1,0], t:[0,-1], b:[0,1]};
// offset* ignora o transform da animação de entrada; getBoundingClientRect mediria o card encolhido.
function box(el) {
  const lid = el.classList.contains('k-store') ? 20 : 0;
  return {x:el.offsetLeft, y:el.offsetTop - lid, w:el.offsetWidth, h:el.offsetHeight + lid};
}
function sides(a, b) {
  if (b.x >= a.x + a.w - 1) return ['r','l'];
  if (b.x + b.w <= a.x + 1) return ['l','r'];
  if (b.y >= a.y + a.h - 1) return ['b','t'];
  return ['t','b'];
}
const horiz = s => s === 'l' || s === 'r';
const along = (r, s, f) => horiz(s) ? r.y + r.h * f : r.x + r.w * f;
function ends(a, b, sa, sb, e) {
  let ua = null, ub = null;
  if (horiz(sa) === horiz(sb) && sa !== sb) {
    const H = horiz(sa);
    const lo = H ? Math.max(a.y, b.y) : Math.max(a.x, b.x), hi = H ? Math.min(a.y + a.h, b.y + b.h) : Math.min(a.x + a.w, b.x + b.w);
    if (hi - lo > 24) ua = ub = (lo + hi) / 2;
  }
  if (e.fa != null) ua = along(a, sa, e.fa);
  if (e.fb != null) ub = along(b, sb, e.fb);
  if (e.off) { ua = (ua ?? along(a, sa, .5)) + e.off; ub = (ub ?? along(b, sb, .5)) + e.off; }
  const pt = (r, s, u) => horiz(s) ? [s === 'l' ? r.x : r.x + r.w, u ?? r.y + r.h / 2] : [u ?? r.x + r.w / 2, s === 't' ? r.y : r.y + r.h];
  return [pt(a, sa, ua), pt(b, sb, ub)];
}
function route(p0, sa, p3, sb, loop) {
  const o = 16, n0 = NV[sa], n3 = NV[sb];
  const q3 = [p3[0] + n3[0] * 3, p3[1] + n3[1] * 3];
  const p1 = [p0[0] + n0[0] * o, p0[1] + n0[1] * o], p2 = [p3[0] + n3[0] * o, p3[1] + n3[1] * o];
  const h0 = !!n0[0], h3 = !!n3[0];
  let mid;
  if (sa === sb) {
    if (h0) { const x = sa === 'l' ? Math.min(p1[0], p2[0]) - 18 : Math.max(p1[0], p2[0]) + 18; mid = [[x, p1[1]], [x, p2[1]]]; }
    else { const y = sa === 't' ? Math.min(p1[1], p2[1]) - (loop ? 26 : 10) : Math.max(p1[1], p2[1]) + 18; mid = [[p1[0], y], [p2[0], y]]; }
  } else if (h0 && h3) { const mx = (p1[0] + p2[0]) / 2; mid = [[mx, p1[1]], [mx, p2[1]]]; }
  else if (!h0 && !h3) { const my = (p1[1] + p2[1]) / 2; mid = [[p1[0], my], [p2[0], my]]; }
  else if (h0) mid = [[p2[0], p1[1]]];
  else mid = [[p1[0], p2[1]]];
  const out = [];
  for (const p of [p0, p1, ...mid, p2, q3]) {
    const z = out[out.length - 1];
    if (z && Math.hypot(p[0] - z[0], p[1] - z[1]) < .5) continue;
    if (out.length >= 2) {
      const y = out[out.length - 2];
      if ((Math.abs(y[0] - z[0]) < .5 && Math.abs(z[0] - p[0]) < .5) || (Math.abs(y[1] - z[1]) < .5 && Math.abs(z[1] - p[1]) < .5)) out.pop();
    }
    out.push(p);
  }
  return out;
}
function pathD(pts, r = 14) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [a, p, b] = [pts[i - 1], pts[i], pts[i + 1]];
    const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const rr = Math.min(r, la / 2, lb / 2);
    const q1 = [p[0] + (a[0] - p[0]) / la * rr, p[1] + (a[1] - p[1]) / la * rr];
    const q2 = [p[0] + (b[0] - p[0]) / lb * rr, p[1] + (b[1] - p[1]) / lb * rr];
    d += ` L${q1[0]},${q1[1]} Q${p[0]},${p[1]} ${q2[0]},${q2[1]}`;
  }
  const z = pts[pts.length - 1];
  return d + ` L${z[0]},${z[1]}`;
}
function wires() {
  if (!state.board || getComputedStyle(state.svg).display === 'none') return;
  for (const z of state.zones) {
    const bs = z.n.map(id => box(byId[id].el));
    const x0 = Math.min(...bs.map(b => b.x)) - 18, y0 = Math.min(...bs.map(b => b.y)) - 36;
    const x1 = Math.max(...bs.map(b => b.x + b.w)) + 18, y1 = Math.max(...bs.map(b => b.y + b.h)) + 18;
    Object.assign(z.el.style, {left:x0 + 'px', top:y0 + 'px', width:(x1 - x0) + 'px', height:(y1 - y0) + 'px'});
  }
  for (const e of state.edges) {
    const A = byId[e.a].el, B = byId[e.b].el; if (!A || !B) continue;
    const a = box(A), b = box(B);
    const [sa, sb] = e.s ? [e.s, e.t] : sides(a, b);
    const [p0, p3] = ends(a, b, sa, sb, e);
    const pts = route(p0, sa, p3, sb, e.loop);
    e.p.setAttribute('d', pathD(pts));
    mark(e);
    if (e.lab) {
      let best = 0, bi = 0;
      for (let i = 0; i < pts.length - 1; i++) { const L = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); if (L > best) { best = L; bi = i; } }
      const [u, w] = [pts[bi], pts[bi + 1]], hz = Math.abs(u[1] - w[1]) < .5;
      e.lab.style.maxWidth = (hz ? Math.max(70, best - 12) : 180) + 'px';
      e.lab.style.left = (u[0] + w[0]) / 2 + 'px'; e.lab.style.top = (u[1] + w[1]) / 2 + 'px';
    }
  }
}
function mark(e) {
  const m = `url(#${ARROW[e.ty][1]})`;
  e.p.setAttribute('marker-end', m);
  if (e.both) e.p.setAttribute('marker-start', m);
}
const ro = new ResizeObserver(() => requestAnimationFrame(wires));

/* ---------- foco: passar o mouse num card acende só as setas dele ---------- */
function focus(id) {
  if (id && (!state.svg || getComputedStyle(state.svg).display === 'none')) return;
  state.focus = id;
  const rel = new Set(id ? [id] : []);
  for (const e of state.edges) if (id && (e.a === id || e.b === id)) { rel.add(e.a); rel.add(e.b); }
  for (const n of VIEWS[state.view].nodes) if (n.el) n.el.classList.toggle('dim', !!id && state.edges.length > 0 && !rel.has(n.id));
  for (const e of state.edges) {
    const on = !!id && (e.a === id || e.b === id);
    e.p.classList.toggle('on', on); e.p.classList.toggle('dim', !!id && !on);
    if (on) state.svg.appendChild(e.p);
    if (e.lab) { e.lab.classList.toggle('on', on); e.lab.classList.toggle('dim', !!id && !on); }
  }
}
stage.addEventListener('pointerover', e => { const n = e.target.closest('.node'); if (n && n.dataset.id !== state.focus) focus(n.dataset.id); });
stage.addEventListener('pointerout', e => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.node')) focus(null); });
stage.addEventListener('focusin', e => { const n = e.target.closest('.node'); if (n) focus(n.dataset.id); });
stage.addEventListener('focusout', () => focus(null));

/* ---------- navegação ---------- */
function go(id, origin) {
  const h = id === 'home' ? '' : '#' + id;
  try { if (location.hash !== h) history.pushState(null, '', h || location.pathname + location.search); } catch (_) {}
  closeDrawer(); render(id, id === 'home' ? 'out' : 'in', origin);
}
addEventListener('popstate', () => { closeDrawer(); render(location.hash.slice(1) || 'home', 'out'); });
stage.addEventListener('click', e => {
  const vb = e.target.closest('[data-view]'); if (vb) { go(vb.dataset.view); return; }
  const tile = e.target.closest('[data-tile]'); if (tile) { openNode(tile.dataset.tile); return; }
  const el = e.target.closest('.node');
  if (!el) { clearPin(); return; }
  const n = byId[el.dataset.id];
  if (n.go) {
    const r = el.getBoundingClientRect(), vr = el.closest('.view').getBoundingClientRect();
    go(n.go, [r.left - vr.left + r.width / 2, r.top - vr.top + r.height / 2]);
  } else if (n.d || el.tagName === 'BUTTON') openNode(n.id);
});
$('#crumbs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
$('#home').addEventListener('click', () => go('home'));
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!drawer.hidden) closeDrawer();
  else if (state.pin) clearPin();
  else if (state.view !== 'home') go('home');
});

/* ---------- painel ---------- */
const sec = (h, body, cls = '') => body ? `<div class="sec ${cls}"><h3>${h}</h3>${body}</div>` : '';
const ul = xs => xs && xs.length ? `<ul>${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
function showDrawer(kind, html) { $('#drawerKind').textContent = kind; $('#drawerBody').innerHTML = html; drawer.hidden = false; drawer.scrollTop = 0; $('#drawerClose').focus({preventScroll:true}); }
function closeDrawer() { drawer.hidden = true; for (const b of ['#bGloss','#bDecs']) $(b).setAttribute('aria-pressed', 'false'); }
$('#drawerClose').addEventListener('click', closeDrawer);
function openNode(id) {
  const n = byId[id]; if (!n) return;
  const d = n.d || {}, v = VIEWS[where[id]];
  const ins = state.edges.filter(e => e.b === id), outs = state.edges.filter(e => e.a === id);
  const nm = o => o.t || o.pill;
  const lk = (e, dir) => { const o = byId[dir === '→' ? e.b : e.a]; return `<button class="lk" type="button" data-go="${o.id}"><span class="dir" aria-hidden="true">${dir}</span><span><b>${esc(nm(o))}</b>${e.l ? `<small>${esc(e.l)}</small>` : ''}</span></button>`; };
  const decs = DEC.filter(x => x.c.includes(id) || (n.parent && x.c.includes(n.parent.id)));
  const metrics = d.metrics ? d.metrics.map(([g, ms, q]) => sec(`${g} · ${q}`, `<div class="mt">${ms.map(m => `<div><b>${esc(m[0])}</b><code>${esc(m[1])}</code><span>${esc(m[2])}</span></div>`).join('')}</div>`)).join('') : '';
  showDrawer(v.n ? `${v.n}. ${v.t}` : 'Overview', `
    <p class="d-eb">${esc(n.parent ? n.parent.t : (n.pill || ''))}</p>
    <h2>${esc(nm(n))}</h2>
    ${n.s ? `<p class="lead">${esc(n.s)}</p>` : ''}
    ${n.ex ? sec('In the example', `<p>${esc(n.ex)}</p>`) : ''}
    ${n.kv ? sec('Servers', `<div class="tbl">${n.kv.map(r => `<b>${esc(r[0])}</b><span>${esc(r[1])}</span>`).join('')}</div>`) : ''}
    ${n.docs ? sec('Kinds of documentation', `<div class="tbl">${n.docs.map(r => `<b>${esc(r[0])}</b><span>${esc(r[1])}</span>`).join('')}</div>`) : ''}
    ${d.tbl ? sec('What it holds', `<div class="tbl">${d.tbl.map(r => `<b>${esc(r[0])}</b><span>${esc(r[1])}</span>`).join('')}</div>`) : ''}
    ${sec('How it works', d.faz && `<p>${esc(d.faz)}</p>`)}
    ${metrics}
    ${sec('Why this way', ul(d.pq))}
    ${sec('Measured', ul(d.num))}
    ${sec('Not done yet or left out', ul(d.fora), 'warn')}
    ${n.tags && n.tags.length ? sec('Technical names', `<div class="codes">${n.tags.map(x => `<code>${esc(x)}</code>`).join('')}</div>`) : ''}
    ${(ins.length || outs.length) ? sec('Arrows', ins.map(e => lk(e, '←')).join('') + outs.map(e => lk(e, '→')).join('')) : ''}
    ${decs.length ? sec('Related decisions', decs.map(x => `<button class="lk" type="button" data-dec="${DEC.indexOf(x)}"><span class="dir" aria-hidden="true">◆</span><span><b>${esc(x.t)}</b><small>${esc(x.g)}</small></span></button>`).join('')) : ''}
    ${d.cod ? sec('In the repository', `<div class="codes">${d.cod.map(x => `<code>${esc(x)}</code>`).join('')}</div>`) : ''}`);
}
drawer.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'), dc = e.target.closest('[data-dec]');
  if (g) openNode(g.dataset.go); else if (dc) showDecision(+dc.dataset.dec);
});

/* ---------- decisões e glossário ---------- */
function applyPin() {
  const set = new Set(state.pin || []);
  for (const n of VIEWS[state.view].nodes) if (n.el) n.el.classList.toggle('pin', set.has(n.id));
}
function clearPin() { state.pin = null; applyPin(); }
function showDecision(i) {
  const d = DEC[i];
  const vid = where[d.c[0]];
  state.pin = d.c;
  if (state.view !== vid) go(vid); else applyPin();
  showDrawer('Decision', `<p class="d-eb">${esc(d.g)}</p><h2>${esc(d.t)}</h2><p class="lead">${esc(d.tx)}</p>
    ${sec('Where it shows up', d.c.map(id => `<button class="lk" type="button" data-go="${id}"><span class="dir" aria-hidden="true">→</span><span><b>${esc(byId[id].t || byId[id].pill)}</b><small>${VIEWS[where[id]].n}. ${esc(VIEWS[where[id]].t)}</small></span></button>`).join(''))}
    <div class="sec"><button class="btn" type="button" id="backDecs">← All decisions</button></div>`);
  $('#backDecs').addEventListener('click', showDecisions);
}
function showDecisions() {
  const groups = [...new Set(DEC.map(d => d.g))];
  showDrawer('Decisions', `<p class="lead">Decisions recorded in the ADRs, the board and the meetings. Click one to see where it shows up.</p>` +
    groups.map(g => `<div class="dgroup ${DEC.find(d => d.g === g).w ? 'warn' : ''}"><h3>${esc(g)}</h3>${DEC.map((d, i) => d.g === g ? `<button class="lk" type="button" data-dec="${i}"><span class="dir" aria-hidden="true">◆</span><span><b>${esc(d.t)}</b><small>${esc(d.tx)}</small></span></button>` : '').join('')}</div>`).join(''));
  $('#bDecs').setAttribute('aria-pressed', 'true');
}
function showGlossary() {
  showDrawer('Glossary', `<p class="lead">The technical terms on the cards, in plain words.</p>
    <dl class="gl">${GLOSS.map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl>`);
  $('#bGloss').setAttribute('aria-pressed', 'true');
}
$('#bDecs').addEventListener('click', () => { const on = !drawer.hidden && $('#bDecs').getAttribute('aria-pressed') === 'true'; closeDrawer(); if (!on) showDecisions(); });
$('#bGloss').addEventListener('click', () => { const on = !drawer.hidden && $('#bGloss').getAttribute('aria-pressed') === 'true'; closeDrawer(); if (!on) showGlossary(); });

/* ---------- tema ---------- */
$('#bTheme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('tais-theme', root.dataset.theme); } catch (_) {}
});
try { const t = localStorage.getItem('tais-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

/* ---------- início ---------- */
render(location.hash.slice(1) || 'home');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(wires);
})();
</script>
</body>
</html>
